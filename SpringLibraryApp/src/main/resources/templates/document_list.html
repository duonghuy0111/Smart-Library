<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Quản lý Tài Liệu</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container py-4">
            <a class="btn btn-secondary mb-3" th:href="@{/admin}">← Quay lại Dashboard</a>
            <div class="d-flex justify-content-between align-items-center mb-4">
                <h3>Danh Sách Tài Liệu</h3>
                <a th:href="@{/admin/documents/add}" class="btn btn-success">Thêm Tài Liệu Mới</a>
            </div>

            <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
            <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

            <form th:action="@{/admin/documents}" method="get" class="row g-3 mb-4">
                <div class="col-md-5">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tên sách, tác giả...">
                </div>
                <div class="col-md-4">
                    <select name="categoryId" class="form-select">
                        <option value="">-- Tất cả danh mục --</option>
                        <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}" th:selected="${selectedCategory == cat.id}"></option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">Tìm kiếm</button>
                </div>
            </form>

            <div class="card shadow-sm">
                <table class="table table-striped mb-0">
                    <thead>
                        <tr><th>ID</th><th>Tên sách</th><th>Tác giả</th><th>Danh mục</th><th>Hành động</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="doc : ${documents}">
                            <td th:text="${doc.id}"></td>
                            <td th:text="${doc.title}"></td>
                            <td th:text="${doc.author}"></td>
                            <td th:text="${doc.category.name}"></td>
                            <td>
                                <a th:href="@{/admin/documents/{id}/edit(id=${doc.id})}" class="btn btn-sm btn-warning">Sửa</a>
                                <form th:action="@{/admin/documents/{id}/delete(id=${doc.id})}" method="post" class="d-inline" onsubmit="return confirm('Xóa tài liệu này?')">
                                    <button type="submit" class="btn btn-sm btn-danger">Xóa</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <nav class="mt-4" th:if="${totalPages != null and totalPages > 1}">
                <ul class="pagination justify-content-center">

                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/documents(page=${currentPage - 1}, keyword=${keyword}, categoryId=${selectedCategory})}">Trước</a>
                    </li>

                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/admin/documents(page=${i}, keyword=${keyword}, categoryId=${selectedCategory})}" th:text="${i}"></a>
                    </li>

                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/documents(page=${currentPage + 1}, keyword=${keyword}, categoryId=${selectedCategory})}">Sau</a>
                    </li>

                </ul>
            </nav>
        </div>
    </body>
</html>
