<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Giao Dịch</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <a class="btn btn-secondary mb-3" th:href="@{/admin}">← Quay lại Dashboard</a>
        <h3 class="mb-4">Lịch Sử Giao Dịch</h3>

        <div class="alert alert-info shadow-sm">
            <strong>Tổng doanh thu toàn hệ thống: </strong>
            <span class="fs-5 text-danger" th:text="${#numbers.formatDecimal(totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' Đ'"></span>
        </div>

        <div class="card shadow-sm">
            <table class="table table-striped mb-0">
                <thead>
                    <tr><th>Mã GD</th><th>Trạng Thái</th></tr>
                </thead>
                <tbody>
                    <tr th:each="t : ${transactions}">
                        <td th:text="${t.id}"></td>
                        <td th:text="${t.status}"></td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(transactions)}"><td colspan="2" class="text-center py-3">Chưa có giao dịch nào</td></tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
