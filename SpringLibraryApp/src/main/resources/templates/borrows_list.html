<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản Lý Mượn Sách</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <a class="btn btn-secondary mb-3" th:href="@{/admin}">← Quay lại Dashboard</a>
        <h3 class="mb-4">Danh Sách Phiếu Mượn</h3>

        <form th:action="@{/admin/borrows}" method="get" class="row g-3 mb-4">
            <div class="col-md-6">
                <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên đăng nhập hoặc họ tên người mượn...">
            </div>
            <div class="col-md-3">
                <button type="submit" class="btn btn-primary w-100">Tìm kiếm</button>
            </div>
        </form>

        <div class="card shadow-sm">
            <table class="table table-striped table-hover mb-0">
                <thead>
                    <tr>
                        <th>Mã Phiếu</th>
                        <th>Người Mượn</th>
                        <th>Ngày Mượn</th>
                        <th>Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="b : ${borrows}">
                        <td th:text="'#' + ${b.id}"></td>
                        <td>
                            <strong th:text="${b.user.fullName}"></strong> 
                            <br><small class="text-muted" th:text="${b.user.username}"></small>
                        </td>
                        <td th:text="${#dates.format(b.createdDate, 'dd/MM/yyyy HH:mm')}"></td>
                        <td>
                            <a th:href="@{/admin/users/{id}(id=${b.user.id})}" class="btn btn-sm btn-info text-white">Xem Chi Tiết Sách Mượn</a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(borrows)}">
                        <td colspan="4" class="text-center py-3 text-muted">Không tìm thấy phiếu mượn nào.</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <nav class="mt-4" th:if="${totalPages > 1}">
            <ul class="pagination justify-content-center">
                <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/borrows(page=${currentPage - 1}, keyword=${keyword})}">Trước</a>
                </li>
                <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i} ? 'active'">
                    <a class="page-link" th:href="@{/admin/borrows(page=${i}, keyword=${keyword})}" th:text="${i}"></a>
                </li>
                <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                    <a class="page-link" th:href="@{/admin/borrows(page=${currentPage + 1}, keyword=${keyword})}">Sau</a>
                </li>
            </ul>
        </nav>
    </div>
</body>
</html>
