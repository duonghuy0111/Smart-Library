<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title th:text="${document.id == null} ? 'Thêm Tài Liệu' : 'Sửa Tài Liệu'"></title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container py-4" style="max-width: 600px;">
            <a class="btn btn-secondary mb-3" th:href="@{/admin/documents}">← Quay lại</a>
            <div class="card shadow-sm">
                <div class="card-body">
                    <h4 class="card-title mb-4" th:text="${document.id == null} ? 'Thêm Tài Liệu Mới' : 'Cập Nhật Tài Liệu'"></h4>
                    <form th:action="${document.id == null} ? @{/admin/documents/add} : @{/admin/documents/{id}/edit(id=${document.id})}" 
                          th:object="${document}" method="post" enctype="multipart/form-data">
                        <input type="hidden" th:field="*{id}" />
                        <div class="mb-3">
                            <label>Tên tài liệu</label>
                            <input type="text" th:field="*{title}" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label>Tác giả</label>
                            <input type="text" th:field="*{author}" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label>Danh mục</label>
                            <select th:field="*{category.id}" class="form-select" required>
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label>Ảnh bìa</label>
                            <input type="file" name="coverFile" class="form-control" accept="image/*" />
                        </div>
                        <div class="mb-3">
                            <label>File đính kèm (PDF, DOC...)</label>
                            <input type="file" name="docFile" class="form-control" />
                        </div>
                        <div class="mb-3">
                            <label>Năm xuất bản</label>
                            <input type="number" th:field="*{publishYear}" class="form-control" required />
                        </div>
                        <div class="mb-3">
                            <label>Mô tả chi tiết</label>
                            <textarea th:field="*{description}" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="form-check mb-3">
                            <input type="checkbox" th:field="*{isPremium}" class="form-check-input" id="isPremium" />
                            <label class="form-check-label text-danger" for="isPremium">Tài liệu có thu phí / bản quyền</label>
                        </div>
                        <button type="submit" class="btn btn-success w-100">Lưu</button>
                    </form>
                </div>
            </div>
        </div>
    </body>
</html>
