<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Đăng Nhập Hệ Thống Thư Viện</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-dark d-flex align-items-center" style="height: 100vh;">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-4 card p-4 shadow-lg">
                <h3 class="text-center mb-4 text-info fw-bold">THƯ VIỆN SỐ SMART</h3>
                
                <div th:if="${param.error}" class="alert alert-danger text-center p-2 small">
                    Tài khoản hoặc mật khẩu không chính xác!
                </div>
                
                <div th:if="${param.logout}" class="alert alert-success text-center p-2 small">
                    Đã đăng xuất thành công.
                </div>

                <form th:action="@{/admin/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label fw-bold">Tên đăng nhập</label>
                        <input type="text" id="username" name="username" class="form-control" placeholder="Nhập username" required />
                    </div>
                    <div class="mb-3">
                        <label for="password" class="form-label fw-bold">Mật khẩu</label>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Nhập mật khẩu" required />
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-info text-white w-100 fw-bold">ĐĂNG NHẬP</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
