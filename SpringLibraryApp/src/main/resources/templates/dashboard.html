<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Thống Kê Thư Viện</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>
<body>
    <div th:replace="~{base :: header}"></div>

    <section class="container mt-4">
        <h2 class="text-info mb-4">Dashboard Thống Kê</h2>
        
        <div class="row">
            <div class="col-md-4">
                <div class="card bg-primary text-white text-center p-4">
                    <h3>Tổng Học Liệu</h3>
                    <h1 class="display-4" th:text="${totalDocuments}">0</h1>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-success text-white text-center p-4">
                    <h3>Lượt Truy Cập</h3>
                    <h1 class="display-4" th:text="${totalAccess}">0</h1>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card bg-warning text-dark text-center p-4">
                    <h3>Doanh Thu (VND)</h3>
                    <h1 class="display-4" th:text="${totalRevenue}">0</h1>
                </div>
            </div>
        </div>
    </section>

    <div th:replace="~{base :: footer}"></div>
</body>
</html>
