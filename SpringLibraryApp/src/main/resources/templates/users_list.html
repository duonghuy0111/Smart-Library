<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Quản lý Người Dùng</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body class="bg-light">
        <div class="container py-4">
            <a class="btn btn-secondary mb-3" th:href="@{/admin}">← Quay lại Dashboard</a>
            <h3 class="mb-4">Danh Sách Người Dùng</h3>

            <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>

            <form th:action="@{/admin/users}" method="get" class="row g-3 mb-4">
                <div class="col-md-5">
                    <input type="text" name="keyword" th:value="${keyword}" class="form-control" placeholder="Tìm theo tên, email, username...">
                </div>
                <div class="col-md-4">
                    <select name="role" class="form-select">
                        <option value="">-- Tất cả chức vụ --</option>
                        <option value="ROLE_USER" th:selected="${role == 'ROLE_USER'}">Độc giả (User)</option>
                        <option value="ROLE_LIBRARIAN" th:selected="${role == 'ROLE_LIBRARIAN'}">Thủ thư (Librarian)</option>
                    </select>
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary w-100">Tìm kiếm</button>
                </div>
            </form>

            <div class="card shadow-sm">
                <table class="table table-striped table-hover mb-0">
                    <thead>
                        <tr><th>ID</th><th>Username</th><th>Họ Tên</th><th>Chức Vụ</th><th>Hành động</th></tr>
                    </thead>
                    <tbody>
                        <tr th:each="u : ${users}">
                            <td th:text="${u.id}"></td>
                            <td th:text="${u.username}"></td>
                            <td th:text="${u.fullName}"></td>
                            <td th:text="${u.role}"></td>
                            <td>
                                <a th:href="@{/admin/users/{id}(id=${u.id})}" class="btn btn-sm btn-info text-white">Xem</a>
                                <a th:href="@{/admin/users/{id}/edit(id=${u.id})}" class="btn btn-sm btn-warning">Sửa</a>
                                <a th:href="@{/admin/users/{id}/delete(id=${u.id})}" 
                                   class="btn btn-sm btn-danger" 
                                   onclick="return confirm('Bạn có chắc chắn muốn xóa người dùng này không?');">
                                    Xóa
                                </a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <nav class="mt-4" th:if="${totalPages > 1}">
                <ul class="pagination justify-content-center">
                    <li class="page-item" th:classappend="${currentPage == 1} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(page=${currentPage - 1}, keyword=${keyword}, role=${role})}">Trước</a>
                    </li>
                    <li class="page-item" th:each="i : ${#numbers.sequence(1, totalPages)}" th:classappend="${currentPage == i} ? 'active'">
                        <a class="page-link" th:href="@{/admin/users(page=${i}, keyword=${keyword}, role=${role})}" th:text="${i}"></a>
                    </li>
                    <li class="page-item" th:classappend="${currentPage == totalPages} ? 'disabled'">
                        <a class="page-link" th:href="@{/admin/users(page=${currentPage + 1}, keyword=${keyword}, role=${role})}">Sau</a>
                    </li>
                </ul>
            </nav>
        </div>
    </body>
</html>
