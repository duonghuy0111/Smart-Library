<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Thống Kê Báo Cáo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <div class="container py-4">
        <a class="btn btn-secondary mb-3" th:href="@{/admin}">← Quay lại Dashboard</a>
        <h2 class="text-success border-bottom pb-2 mb-4">📊 BÁO CÁO TỔNG QUAN & CHIẾN LƯỢC</h2>

        <div class="card p-3 mb-4 shadow-sm bg-white border-0">
            <form th:action="@{/admin/stats}" method="get" id="statsForm" class="row align-items-center g-3">
                <div class="col-auto">
                    <label class="form-label mb-0 fw-bold text-secondary">Chu kỳ báo cáo:</label>
                </div>
                <div class="col-auto">
                    <select name="period" class="form-select form-select-sm border-primary fw-semibold" onchange="this.form.submit()">
                        <option value="MONTHS" th:selected="${period == 'MONTHS'}">Xem theo Tháng</option>
                        <option value="QUARTERS" th:selected="${period == 'QUARTERS'}">Xem theo Quý</option>
                        <option value="YEARS" th:selected="${period == 'YEARS'}">Xem theo Năm</option>
                    </select>
                </div>
                <div class="col-auto" th:if="${period != 'YEARS'}">
                    <select name="year" class="form-select form-select-sm" onchange="this.form.submit()">
                        <option value="2024" th:selected="${selectedYear == 2024}">Năm 2024</option>
                        <option value="2025" th:selected="${selectedYear == 2025}">Năm 2025</option>
                        <option value="2026" th:selected="${selectedYear == 2026}">Năm 2026</option>
                    </select>
                </div>
            </form>
        </div>

        <div class="row g-4 mb-5">
            <div class="col-lg-8">
                <div class="card shadow-sm border-0 mb-4 h-100">
                    <div class="card-header bg-white fw-bold text-success">📈 Biểu đồ Doanh thu & Tần suất mượn</div>
                    <div class="card-body">
                        <canvas id="mainChart" height="120"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="card shadow-sm border-0 h-100">
                    <div class="card-header bg-white fw-bold text-primary">🎯 Cơ cấu tài nguyên theo Ngành</div>
                    <div class="card-body d-flex align-items-center justify-content-center">
                        <canvas id="categoryChart"></canvas>
                    </div>
                </div>
            </div>
        </div>

        <h5 class="text-danger fw-bold mt-5 mb-3 border-bottom pb-2">🔥 CHIẾN LƯỢC: TOP SÁCH HIỆU QUẢ CAO NHẤT (ROI)</h5>
        <div class="card shadow-sm mb-4 border-0">
            <div class="card-body p-0">
                <table class="table table-hover mb-0 align-middle text-center">
                    <thead class="table-light">
                        <tr>
                            <th class="text-start px-4">Tên Tài Liệu Bản Quyền</th>
                            <th>Vốn Đầu Tư</th>
                            <th>Tổng Doanh Thu</th>
                            <th>Chỉ số ROI</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${roiStats}">
                            <td class="text-start fw-semibold text-primary px-4" th:text="${item.documentName}"></td>
                            <td th:text="${#numbers.formatDecimal(item.capitalCost, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td class="fw-bold text-success" th:text="${#numbers.formatDecimal(item.totalRevenue, 0, 'COMMA', 0, 'POINT')} + ' đ'"></td>
                            <td>
                                <span class="badge fs-6 px-3 py-1" 
                                      th:classappend="${item.roiPercentage > 0 ? 'bg-success' : 'bg-danger'}"
                                      th:text="${item.roiPercentage > 0 ? '+' : ''} + ${item.roiPercentage} + '%'">
                                </span>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(roiStats)}">
                            <td colspan="4" class="text-center py-4 text-muted">Hệ thống chưa ghi nhận doanh thu từ tài liệu có phí nào.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script th:inline="javascript">
        /*<![CDATA[*/
        const borrowDataRaw = /*[[${borrowStats}]]*/ [];
        const revenueDataRaw = /*[[${revenueStats}]]*/ [];
        const categoryDataRaw = /*[[${categoryStats}]]*/ [];
        const currentPeriod = /*[[${period}]]*/ 'MONTHS';
        const selectedYear = /*[[${selectedYear}]]*/ 2026;
        /*]]>*/

        // 1. XỬ LÝ DỮ LIỆU ĐỘNG THEO BỘ LỌC
        let chartLabels = [];
        let borrowData = [];
        let revenueData = [];

        if (currentPeriod === 'YEARS') {
            chartLabels = ["Năm 2024", "Năm 2025", "Năm 2026"];
            borrowData = [0, 0, 0];
            revenueData = [0, 0, 0]; 
            
            // Lượt mượn trả về dạng: [Năm, Số lượng]
            borrowDataRaw.forEach(item => {
                let yIndex = chartLabels.indexOf("Năm " + item[0]);
                if(yIndex !== -1) borrowData[yIndex] = item[1];
            });
            // Tạm đổ dồn doanh thu của query vào năm đang chọn
            revenueDataRaw.forEach(item => {
                let yIndex = chartLabels.indexOf("Năm " + selectedYear);
                if(yIndex !== -1) revenueData[yIndex] += item[1];
            });

        } else if (currentPeriod === 'QUARTERS') {
            chartLabels = ["Quý 1", "Quý 2", "Quý 3", "Quý 4"];
            borrowData = [0, 0, 0, 0];
            revenueData = [0, 0, 0, 0];
            
            // Backend trả về Tháng (1-12) -> Nhóm 3 tháng vào 1 Quý
            borrowDataRaw.forEach(item => {
                let qIndex = Math.ceil(parseInt(item[0]) / 3) - 1;
                borrowData[qIndex] += item[1];
            });
            revenueDataRaw.forEach(item => {
                let qIndex = Math.ceil(parseInt(item[0]) / 3) - 1;
                revenueData[qIndex] += item[1];
            });

        } else {
            // Mặc định là theo THÁNG
            chartLabels = ["Tháng 1", "Tháng 2", "Tháng 3", "Tháng 4", "Tháng 5", "Tháng 6", "Tháng 7", "Tháng 8", "Tháng 9", "Tháng 10", "Tháng 11", "Tháng 12"];
            borrowData = Array(12).fill(0);
            revenueData = Array(12).fill(0);
            
            borrowDataRaw.forEach(item => {
                let mIndex = parseInt(item[0]) - 1;
                if(mIndex >= 0 && mIndex < 12) borrowData[mIndex] = item[1];
            });
            revenueDataRaw.forEach(item => {
                let mIndex = parseInt(item[0]) - 1;
                if(mIndex >= 0 && mIndex < 12) revenueData[mIndex] = item[1];
            });
        }

        // 2. VẼ BIỂU ĐỒ KẾP (ĐƯỜNG + CỘT)
        // 2. VẼ BIỂU ĐỒ CỘT KÉP (DOANH THU & LƯỢT MƯỢN)
        new Chart(document.getElementById('mainChart'), {
            type: 'bar',
            data: {
                labels: chartLabels,
                datasets: [
                    {
                        type: 'bar', // 👉 Đã chuyển từ 'line' sang 'bar'
                        label: 'Lượt mượn sách',
                        data: borrowData,
                        backgroundColor: 'rgba(255, 193, 7, 0.8)', // Màu vàng
                        borderColor: '#ffc107',
                        borderWidth: 1,
                        borderRadius: 4, // Bo góc nhè nhẹ cho hiện đại
                        yAxisID: 'y1' // Dùng trục Y bên phải để chia tỷ lệ số lượng nhỏ (1, 2, 3...)
                    },
                    {
                        type: 'bar',
                        label: 'Doanh thu (VNĐ)',
                        data: revenueData,
                        backgroundColor: 'rgba(25, 135, 84, 0.8)', // Màu xanh lá
                        borderColor: '#198754',
                        borderWidth: 1,
                        borderRadius: 4,
                        yAxisID: 'y'  // Dùng trục Y bên trái cho số tiền lớn (hàng ngàn/triệu)
                    }
                ]
            },
            options: {
                responsive: true,
                interaction: {
                    mode: 'index', // Rê chuột vào 1 điểm sẽ hiển thị tooltip của cả 2 cột
                    intersect: false,
                },
                scales: {
                    y: { 
                        type: 'linear', 
                        display: true, 
                        position: 'left', 
                        beginAtZero: true, 
                        title: { display: true, text: 'Doanh Thu (đ)', font: {weight: 'bold'} } 
                    },
                    y1: { 
                        type: 'linear', 
                        display: true, 
                        position: 'right', 
                        beginAtZero: true, 
                        grid: { drawOnChartArea: false }, // Ẩn đường kẻ lưới của trục phụ để biểu đồ không bị rối
                        ticks: { stepSize: 1 }, 
                        title: { display: true, text: 'Lượt mượn', font: {weight: 'bold'} } 
                    }
                }
            }
        });

        // 3. VẼ BIỂU ĐỒ TRÒN (CƠ CẤU DANH MỤC)
        const pieLabels = categoryDataRaw.length > 0 ? categoryDataRaw.map(i => i[0]) : ["Chưa có dữ liệu"];
        const pieCounts = categoryDataRaw.length > 0 ? categoryDataRaw.map(i => i[1]) : [1];

        new Chart(document.getElementById('categoryChart'), {
            type: 'pie',
            data: {
                labels: pieLabels,
                datasets: [{
                    data: pieCounts,
                    backgroundColor: ['#0d6efd', '#198754', '#ffc107', '#dc3545', '#6f42c1', '#fd7e14', '#20c997'],
                    borderWidth: 1
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
    </script>
</body>
</html>
