<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Quản lý Danh Mục</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <a class="btn btn-secondary mb-3" th:href="@{/admin}">← Quay lại Dashboard</a>
        <h3 class="mb-4">Quản Lý Danh Mục</h3>

        <div th:if="${successMsg}" class="alert alert-success" th:text="${successMsg}"></div>
        <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>

        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5>Thêm Danh Mục</h5>
                        <form th:action="@{/admin/categories/add}" th:object="${newCategory}" method="post">
                            <div class="mb-3">
                                <input type="text" th:field="*{name}" class="form-control" required placeholder="Tên danh mục...">
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Thêm</button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div class="card shadow-sm">
                    <table class="table align-middle mb-0">
                        <thead>
                            <tr><th>ID</th><th>Tên Danh Mục</th><th>Hành động</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="cat : ${categories}">
                                <td th:text="${cat.id}"></td>
                                <td>
                                    <form th:action="@{/admin/categories/{id}/edit(id=${cat.id})}" method="post" class="d-flex">
                                        <input type="text" name="name" th:value="${cat.name}" class="form-control form-control-sm me-2" required>
                                        <button type="submit" class="btn btn-sm btn-outline-warning">Sửa</button>
                                    </form>
                                </td>
                                <td>
                                    <form th:action="@{/admin/categories/{id}/delete(id=${cat.id})}" method="post" onsubmit="return confirm('Bạn chắc chắn muốn xóa?')">
                                        <button type="submit" class="btn btn-sm btn-danger">Xóa</button>
                                    </form>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
