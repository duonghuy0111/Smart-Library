<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
    <head>
        <title>Duyệt Thủ Thư</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>
<body>
    <div th:replace="~{base :: header}"></div>

    <section class="container mt-4">
        <h2 class="text-danger mb-4">Danh Sách Thủ Thư Chờ Duyệt</h2>

        <table class="table table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên Tài Khoản</th>
                    <th>Họ & Tên</th>
                    <th>Trạng Thái</th>
                    <th>Hành Động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u: ${pendingUsers}">
                    <td th:text="${u.id}"></td>
                    <td th:text="${u.username}"></td>
                    <td th:text="${u.fullName}"></td>
                    <td>
                        <span th:if="${u.isApproved}" class="badge bg-success">Đã duyệt</span>

                        <span th:unless="${u.isApproved}" class="badge bg-warning text-dark">Chờ duyệt</span>
                    </td>
                    <td>
                        <button class="btn btn-success btn-sm" th:onclick="'approveLibrarian(\'' + @{/admin/users/approve/} + ${u.id} + '\')'">Duyệt Quyền</button>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>

    <div th:replace="~{base :: footer}"></div>
    <script>
        function approveLibrarian(url) {
            if (confirm("Bạn xác nhận cấp quyền cho thủ thư này?") === true) {
                fetch(url, {
                    method: "post" // Hoặc put tùy cấu hình API của em
                }).then(res => {
                    if (res.status === 200 || res.status === 204) {
                        alert("Đã duyệt tài khoản thành công!");
                        location.reload();
                    } else {
                        alert("Lỗi khi duyệt tài khoản!");
                    }
                });
            }
        }
    </script>
</body>
</html>
