
<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Quản Lý Danh Mục Chuyên Ngành</title>
    <th:block th:replace="~{base :: css}"></th:block>
</head>
<body>
    <div th:replace="~{base :: header}"></div>
    <section class="container mt-4">
        <h2 class="text-primary mb-4">Quản Lý Danh Mục Học Liệu</h2>
        
        <form th:action="@{/admin/categories/save}" method="post" class="row g-3 mb-4 bg-light p-3 rounded border">
            <div class="col-md-4">
                <input type="text" name="name" class="form-control" placeholder="Tên danh mục mới" required />
            </div>
            <div class="col-md-6">
                <input type="text" name="description" class="form-control" placeholder="Mô tả ngắn gọn" />
            </div>
            <div class="col-col-md-2">
                <button type="submit" class="btn btn-success w-100">Thêm Danh Mục</button>
            </div>
        </form>

        <table class="table table-striped table-bordered">
            <thead class="table-dark">
                <tr>
                    <th>ID</th>
                    <th>Tên Danh Mục</th>
                    <th>Mô Tả Chuyên Ngành</th>
                    <th>Hành Động</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="c : ${categories}">
                    <td th:text="${c.id}"></td>
                    <td th:text="${c.name}"></td>
                    <td th:text="${c.description}"></td>
                    <td>
                        <a th:href="@{/admin/categories/delete/{id}(id=${c.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Xóa danh mục này có thể ảnh hưởng đến các tài liệu liên quan?')">Xóa</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </section>
    <div th:replace="~{base :: footer}"></div>
</body>
</html>
