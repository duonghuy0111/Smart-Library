<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sửa Người Dùng</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4" style="max-width: 600px;">
        <a class="btn btn-secondary mb-3" th:href="@{/admin/users}">← Quay lại</a>
        
        <div th:if="${errorMsg}" class="alert alert-danger" th:text="${errorMsg}"></div>
        
        <div class="card shadow-sm" th:if="${user != null}">
            <div class="card-body">
                <h4 class="card-title mb-4">Sửa thông tin</h4>
                
                <form th:action="@{/admin/users/{id}/edit(id=${user.id})}" th:object="${user}" method="post">
                    
                    <input type="hidden" th:field="*{id}">

                    <div class="mb-3">
                        <label class="form-label">Họ Tên</label>
                        <input type="text" th:field="*{fullName}" th:value="${user.fullName}" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" th:field="*{email}" th:value="${user.email}" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label class="form-label">Phân quyền (Role)</label>
                        <select th:field="*{role}" class="form-select">
                            <option value="ROLE_USER">Người dùng (USER)</option>
                            <option value="ROLE_LIBRARIAN">Thủ thư (LIBRARIAN)</option>
                            <option value="ROLE_ADMIN">Quản trị viên (ADMIN)</option>
                        </select>
                    </div>
                    
                    <button type="submit" class="btn btn-primary w-100">Lưu thông tin</button>
                </form>
            </div>
        </div>
        
        <div th:if="${user == null}" class="alert alert-warning">
            Không tìm thấy thông tin thành viên này hoặc dữ liệu bị lỗi!
        </div>
    </div>
</body>
</html>
